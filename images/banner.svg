  <text x="800" y="260" font-family="Consolas, 'Courier New', monospace" font-size="34" fill="rgba(255,255,255,0.85)" text-anchor="middle" dominant-baseline="middle">BANNER IMAGE PLACEHOLDER</text>
  <text x="800" y="300" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle" dominant-baseline="middle">1600 x 500</text>
